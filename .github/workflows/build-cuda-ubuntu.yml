name: Build llama.cpp (CUDA, Ubuntu)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths: [
      '.github/workflows/build-cuda-ubuntu.yml',
      '**/CMakeLists.txt',
      '**/.cmake',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.cu',
      '**/*.cuh'
    ]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/build-cuda-ubuntu.yml',
      'ggml/src/ggml-cuda/**'
    ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  cuda:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.2-devel-ubuntu24.04

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update
          apt install -y cmake build-essential ninja-build libgomp1 git libssl-dev

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: cuda-ubuntu-24.04-cuda
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Build with CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=89-real \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_CUB_3DOT2=ON
          cmake --build build

      - name: Gather artifacts into a flat directory
        run: |
          mkdir -p portable-release
          
          find build/bin -type f -executable -exec cp {} portable-release/ \; 2>/dev/null || true
          
          find build -type f -name "*.so*" -exec cp {} portable-release/ \;
          find build -type l -name "*.so*" -exec cp -d {} portable-release/ \;
          
          # Universal copy for CUDA/NCCL runtimes. Runs ldd on all binaries/libs, 
          # filters for libcu* or libnccl*, excludes host driver libcuda.so, and copies them over.
          find portable-release/ -type f \( -executable -o -name "*.so*" \) -exec ldd {} + 2>/dev/null \
            | awk '/=>/ {print $1, $3}' \
            | sort -u \
            | grep -E "^(libcu|libnccl)" \
            | grep -v "^libcuda\.so" \
            | awk '{print $2}' \
            | xargs -I {} cp -n -L {} portable-release/ || true

      - name: Upload GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-ubuntu-cuda
          path: portable-release/
          retention-days: 14
